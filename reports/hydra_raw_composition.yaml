data:
  name: local_raw
  format: raw
  channels: 16
  root: ${oc.env:META_RAW_ROOT}
  manifest_path: ${oc.env:META_RAW_MANIFEST_PATH}
  corpus_path: ${oc.env:META_CORPUS_PATH,${oc.env:META_WRIST_CORPUS,${hydra:runtime.cwd}/../MetaEMGFM/data/real/wrist/wrist_corpus.csv}}
  task_id: wrist_angle
  window_ms: 200
  stride_ms: 100
  batch_size: 2
  num_workers: 0
  sampler_seed: 42
model:
  name: ring_criss_cross
  d_model: 128
  depth: 6
  heads: 8
  patch_samples: 40
  channels: 16
  dropout: 0.0
trainer:
  accelerator: gpu
  devices: 1
  precision: 32-true
  max_epochs: -1
  logger: false
  enable_checkpointing: true
  enable_progress_bar: false
  enable_model_summary: false
  num_sanity_val_steps: 0
  limit_val_batches: 2000
  default_root_dir: .
  callbacks:
    diagnostics:
      _target_: semg_fm.local_callbacks.TrainingDiagnostics
      output_dir: .
    checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: .
      filename: checkpoint_step{step}
      save_last: true
      save_top_k: 0
      every_n_train_steps: 10
  max_steps: ${optimizer.max_steps}
  check_val_every_n_epoch: null
  val_check_interval: 2000
task: pretrain
seed: 0
resume_from: null
mask:
  temporal_span: 2
  ring_arc: 3
  full_channel_probability: 0.1
  block_shape:
  - 2
  - 2
  random_patch_probability: 0.15
objective:
  latent_weight: 1.0
  kinematic_weight: 1.0
  kinematic_dim: null
  ema_decay: 0.996
optimizer:
  learning_rate: 0.001
  weight_decay: 0.05
  warmup_steps: 1000
  max_steps: 100000
