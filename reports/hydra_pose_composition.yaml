data:
  name: local
  format: canonical
  channels: 16
  root: ${oc.env:META_CANONICAL_ROOT,${hydra:runtime.cwd}/../MetaEMGFM/data/canonical}
  manifest_path: ${oc.env:META_MANIFEST_PATH,${data.root}/manifest.csv}
  corpus_path: null
  task_id: pose
  window_ms: 200
  stride_ms: 100
  batch_size: 2
  num_workers: 0
  sampler_seed: 42
model:
  name: ring_criss_cross
  d_model: 32
  depth: 2
  heads: 4
  patch_samples: 40
  channels: 16
  dropout: 0.0
task:
  name: pose
  output_dim: 20
  target_name: null
  class_names: []
  vocabulary: []
trainer:
  accelerator: gpu
  devices: 1
  precision: 32-true
  max_epochs: -1
  max_steps: 2
  logger: false
  enable_checkpointing: true
  enable_progress_bar: false
  enable_model_summary: false
  num_sanity_val_steps: 0
  limit_val_batches: 1
  limit_test_batches: 2
  default_root_dir: .
  callbacks:
    checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: .
      filename: checkpoint_step{step}
      save_last: true
      save_top_k: 0
      every_n_train_steps: 1
command: finetune
seed: 42
resume_from: null
pretrained_checkpoint: null
finetune_mode: probe
unfrozen_blocks: 1
label_budget: 1.0
optimizer:
  learning_rate: 0.001
  weight_decay: 0.05
