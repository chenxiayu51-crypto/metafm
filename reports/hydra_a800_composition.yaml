data:
  name: local
  format: canonical
  channels: 16
  root: ${oc.env:META_CANONICAL_ROOT,${hydra:runtime.cwd}/../MetaEMGFM/data/canonical}
  manifest_path: ${oc.env:META_MANIFEST_PATH,${data.root}/manifest.csv}
  corpus_path: ${oc.env:META_CORPUS_PATH,${oc.env:META_WRIST_CORPUS,${hydra:runtime.cwd}/../MetaEMGFM/data/real/wrist/wrist_corpus.csv}}
  task_id: wrist_angle
  window_ms: 200
  stride_ms: 100
  batch_size: 2
  num_workers: 0
  sampler_seed: 42
model:
  name: ring_criss_cross
  d_model: 128
  depth: 6
  heads: 8
  patch_samples: 40
  channels: 16
  dropout: 0.0
trainer:
  accelerator: gpu
  devices: auto
  strategy: auto
  precision: bf16-mixed
  max_epochs: -1
  accumulate_grad_batches: 1
  use_distributed_sampler: false
  gradient_clip_val: 1.0
  enable_progress_bar: false
  callbacks:
    checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: checkpoints
      filename: '{epoch}-{step}'
      monitor: val/loss
      mode: min
      save_top_k: 1
      save_last: true
  max_steps: ${optimizer.max_steps}
  check_val_every_n_epoch: null
  val_check_interval: 2000
  limit_val_batches: 2000
task: pretrain
seed: 0
resume_from: null
mask:
  temporal_span: 2
  ring_arc: 3
  full_channel_probability: 0.1
  block_shape:
  - 2
  - 2
  random_patch_probability: 0.15
objective:
  latent_weight: 1.0
  kinematic_weight: 1.0
  kinematic_dim: null
  ema_decay: 0.996
optimizer:
  learning_rate: 0.001
  weight_decay: 0.05
  warmup_steps: 1000
  max_steps: 100000
